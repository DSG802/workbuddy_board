plugins {
    id 'com.android.application'
}

apply plugin: 'com.chaquo.python'

def ksProps = new Properties()
def ksFile = rootProject.file("keystore/keystore.properties")
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.workbuddy.board'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.board"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "8.0"

        // 只打 arm64：多带一个 ABI 会让 Python 运行时体积翻倍。
        ndk { abiFilters "arm64-v8a" }

        python {
            version "3.12"
        }
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
