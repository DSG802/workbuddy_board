# 下载站 nginx 反代（统一挂主 nginx，见 /data/nginx/conf.d/dl.lhwj.top.conf）

server {
    listen 80;
    server_name dl.lhwj.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dl.lhwj.top;

    ssl_certificate     /etc/nginx/ssl_crt/lhwj.top.pem;
    ssl_certificate_key /etc/nginx/ssl_crt/lhwj.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/dl.lhwj.top/access.log main;
    error_log  /var/log/nginx/dl.lhwj.top/error.log;

    # 上游是 compose 里的容器 dl:80，必须走 resolver + 变量，避免容器缺失时 nginx 起不来
    resolver 127.0.0.11 valid=10s;
    set $up dl:80;

    location / {
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        # 大文件传输：关缓冲 + 关闭分块重组，下载更稳
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
